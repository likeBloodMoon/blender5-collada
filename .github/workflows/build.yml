name: Package Blender Extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python syntax
        run: python3 -m py_compile io_scene_collada/*.py

      - name: Build extension zip
        run: |
          mkdir -p dist
          VERSION=$(grep '^version' io_scene_collada/blender_manifest.toml | sed -E 's/.*"([^"]+)".*/\1/')
          (cd io_scene_collada && zip -r "../dist/collada_io-${VERSION}.zip" . -x "*__pycache__*" "*.pyc")
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: collada_io-extension
          path: dist/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        permissions:
          contents: write
