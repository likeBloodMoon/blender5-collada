name: Build, Lint & Parity Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BLENDER_45_VER: "4.5.1"
  BLENDER_45_SHA256: "085a7ed4ed80c3cb66783bad76f236f39897de5d33884abd133e0c6db94c0f14"
  BLENDER_53_SHA256: "dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ruff lint check
        run: |
          python3 -m pip install --quiet ruff
          ruff check --select F,E9 io_scene_collada

  build-native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and fuzz-test native fastfmt (linux-x64, 10M floats)
        run: |
          mkdir -p io_scene_collada/_native
          g++ -O3 -std=c++17 -shared -fPIC -pthread native/fastfmt.cpp -o io_scene_collada/_native/libfastfmt.so
          python3 -m pip install --quiet numpy
          python3 tests/smoke_fastfmt.py
          python3 tests/fuzz_fastfmt.py
      - name: Upload linux-x64 native binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-x64
          path: io_scene_collada/_native/libfastfmt.so

  build-native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Build native fastfmt (windows-x64)
        shell: cmd
        run: |
          mkdir io_scene_collada\_native
          cl /O2 /std:c++17 /LD /EHsc native\fastfmt.cpp /Fe:io_scene_collada\_native\fastfmt.dll
      - name: Smoke-test native fastfmt (windows-x64)
        run: |
          python -m pip install --quiet numpy
          python tests/smoke_fastfmt.py
      - name: Upload windows-x64 native binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows-x64
          path: io_scene_collada/_native/fastfmt.dll

  build-native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and smoke-test native fastfmt (macos-arm64 and macos-x64)
        run: |
          mkdir -p out/macos-arm64 out/macos-x64 io_scene_collada/_native
          clang++ -O3 -std=c++17 -arch arm64 -shared -fPIC native/fastfmt.cpp -o out/macos-arm64/libfastfmt.dylib
          clang++ -O3 -std=c++17 -arch x86_64 -shared -fPIC native/fastfmt.cpp -o out/macos-x64/libfastfmt.dylib
          cp out/macos-arm64/libfastfmt.dylib io_scene_collada/_native/libfastfmt.dylib
          python3 -m venv /tmp/smoke_venv
          /tmp/smoke_venv/bin/pip install --quiet numpy
          /tmp/smoke_venv/bin/python tests/smoke_fastfmt.py
      - name: Upload macos-arm64 native binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-arm64
          path: out/macos-arm64/libfastfmt.dylib
      - name: Upload macos-x64 native binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-x64
          path: out/macos-x64/libfastfmt.dylib

  test-parity:
    needs: [lint, build-native-linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender_ver: "5.0.1"
            blender_dir: "Blender5.0"
            blender_sha256: "8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09"
          - blender_ver: "5.3.0"
            blender_dir: "Blender5.3"
            blender_sha256: "dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download linux-x64 native binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-x64
          path: io_scene_collada/_native

      - name: Install headless Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libgl1 libxkbcommon0 libsm6 xz-utils

      - name: Cache Blender 4.5.1 and ${{ matrix.blender_ver }}
        id: cache-blender
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: blender-linux-${{ env.BLENDER_45_VER }}-${{ matrix.blender_ver }}

      - name: Download and verify Blender 4.5.1 LTS and Blender ${{ matrix.blender_ver }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools /tmp/blender_dl
          curl -fsSL "https://download.blender.org/release/Blender4.5/blender-${BLENDER_45_VER}-linux-x64.tar.xz" -o "/tmp/blender_dl/blender-${BLENDER_45_VER}-linux-x64.tar.xz"
          echo "${BLENDER_45_SHA256}  /tmp/blender_dl/blender-${BLENDER_45_VER}-linux-x64.tar.xz" | sha256sum -c -
          tar -xJf "/tmp/blender_dl/blender-${BLENDER_45_VER}-linux-x64.tar.xz" -C .tools
          curl -fsSL "https://download.blender.org/release/${{ matrix.blender_dir }}/blender-${{ matrix.blender_ver }}-linux-x64.tar.xz" -o "/tmp/blender_dl/blender-${{ matrix.blender_ver }}-linux-x64.tar.xz"
          echo "${{ matrix.blender_sha256 }}  /tmp/blender_dl/blender-${{ matrix.blender_ver }}-linux-x64.tar.xz" | sha256sum -c -
          tar -xJf "/tmp/blender_dl/blender-${{ matrix.blender_ver }}-linux-x64.tar.xz" -C .tools
          rm -rf /tmp/blender_dl

      - name: Configure portable Blender ${{ matrix.blender_ver }} and install extension
        run: |
          mkdir -p ".tools/blender-${{ matrix.blender_ver }}-linux-x64/portable" dist
          BLENDER_5X=".tools/blender-${{ matrix.blender_ver }}-linux-x64/blender"
          "$BLENDER_5X" --command extension validate io_scene_collada
          "$BLENDER_5X" --command extension build --source-dir io_scene_collada --output-dir dist
          ZIP_FILE=$(ls dist/collada_io-*.zip | head -n 1)
          "$BLENDER_5X" --command extension install-file -r user_default -e "$ZIP_FILE"

      - name: Run Core & Deep Parity Suites (COLLADA_NATIVE=1)
        env:
          COLLADA_NATIVE: "1"
        run: |
          python3 tests/run_parity_tests.py
          python3 tests/run_deep_verification.py
          mkdir -p tests/_work_native
          cp tests/_work/*_53.dae tests/_work_native/

      - name: Run Malformed, Fuzz (N=200), Archive, and BeamNG .cdae Synthetic Tests
        run: |
          export BLENDER_5X=".tools/blender-${{ matrix.blender_ver }}-linux-x64/blender"
          python3 -m pip install --quiet numpy
          python3 tests/test_malformed.py
          COLLADA_NATIVE=1 FUZZ_ITERS=200 python3 tests/fuzz_import.py
          COLLADA_NATIVE=0 FUZZ_ITERS=200 python3 tests/fuzz_import.py
          python3 tests/test_archives.py
          python3 tests/test_cdae_import.py
          python3 tests/test_cdae_export.py
          python3 tests/test_keep_normals.py
          python3 tests/test_keep_quads.py
          python3 tests/test_uv_color_dedupe.py
          python3 tests/test_accuracy_roundtrip.py
          python3 tests/test_ux_helpers.py
          python3 tests/test_dae_edge_cases.py
          python3 tests/test_render_modifiers.py
          python3 tests/test_edit_mode_export.py
          python3 tests/test_hidden_objects_export.py
          python3 tests/test_export_scaling.py
          python3 tests/test_beamng_parse.py
          python3 tests/test_beamng_resolve.py
          python3 tests/test_jbeam_expr_limits.py

      - name: Verify byte-identical output with COLLADA_NATIVE=0 fallback
        env:
          COLLADA_NATIVE: "0"
          REUSE_BLENDS: "1"
        run: |
          python3 tests/run_parity_tests.py
          python3 -c "
          import glob, os, re, sys
          for p in sorted(glob.glob('tests/_work_native/*_53.dae')):
              other = os.path.join('tests/_work', os.path.basename(p))
              b1 = open(p, 'rb').read()
              b2 = open(other, 'rb').read()
              n1 = re.sub(rb'<(created|modified)>.*?</\1>', b'', b1)
              n2 = re.sub(rb'<(created|modified)>.*?</\1>', b'', b2)
              if n1 != n2:
                  print(f'NATIVE vs FALLBACK DIFF in {os.path.basename(p)}')
                  sys.exit(1)
          print('ALL 19 EXPORTS BYTE-IDENTICAL BETWEEN NATIVE=1 AND NATIVE=0')
          "

  package-and-release:
    needs: [build-native-linux, build-native-windows, build-native-macos, test-parity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all available native binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native_bins

      - name: Install headless Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libgl1 libxkbcommon0 libsm6 xz-utils

      - name: Restore cached Blender 5.3.0
        id: cache-blender
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: blender-linux-${{ env.BLENDER_45_VER }}-5.3.0

      - name: Download and verify Blender 5.3.0 if needed
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools /tmp/blender_dl
          curl -fsSL "https://download.blender.org/release/Blender5.3/blender-5.3.0-linux-x64.tar.xz" -o "/tmp/blender_dl/blender-5.3.0-linux-x64.tar.xz"
          echo "${BLENDER_53_SHA256}  /tmp/blender_dl/blender-5.3.0-linux-x64.tar.xz" | sha256sum -c -
          tar -xJf "/tmp/blender_dl/blender-5.3.0-linux-x64.tar.xz" -C .tools
          rm -rf /tmp/blender_dl

      - name: Build pure-Python and per-platform accelerated extension zips
        run: |
          BLENDER=".tools/blender-5.3.0-linux-x64/blender"
          VERSION=$(grep '^version' io_scene_collada/blender_manifest.toml | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p dist

          # 1. Pure-Python universal zip (works on every platform, no native binary)
          rm -rf io_scene_collada/_native
          "$BLENDER" --command extension validate io_scene_collada
          "$BLENDER" --command extension build --source-dir io_scene_collada --output-dir dist
          mv "dist/collada_io-${VERSION}.zip" "dist/collada_io-${VERSION}-pure-python.zip"

          # 2. Per-platform native-accelerated zips for every built platform
          cp io_scene_collada/blender_manifest.toml /tmp/manifest_orig.toml
          for plat in linux-x64 windows-x64 macos-arm64 macos-x64; do
            if [ ! -d "native_bins/native-${plat}" ]; then
              echo "Skipping ${plat} (native binary not built)"
              continue
            fi
            rm -rf io_scene_collada/_native
            mkdir -p io_scene_collada/_native
            cp native_bins/native-${plat}/* io_scene_collada/_native/
            cp /tmp/manifest_orig.toml io_scene_collada/blender_manifest.toml
            sed -i "s|^\[permissions\]|platforms = [\"${plat}\"]\n\n[permissions]|" io_scene_collada/blender_manifest.toml
            "$BLENDER" --command extension validate io_scene_collada
            "$BLENDER" --command extension build --source-dir io_scene_collada --output-dir dist --split-platforms
          done
          cp /tmp/manifest_orig.toml io_scene_collada/blender_manifest.toml
          rm -rf io_scene_collada/_native
          (cd dist && sha256sum collada_io-*.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          ls -lh dist/

      - name: Upload built extension artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collada_io-extensions
          path: |
            dist/collada_io-*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/collada_io-*.zip
            dist/SHA256SUMS.txt
