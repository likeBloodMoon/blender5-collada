name: Feature request
description: Suggest something new or a change to how the add-on works.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Not sure if it's a good fit? Start in [Discussions > Ideas](https://github.com/likeBloodMoon/blender5-collada/discussions/categories/ideas) first. The [roadmap](https://github.com/likeBloodMoon/blender5-collada/blob/main/ROADMAP.md) lists what's already planned.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not the solution yet.
      placeholder: I export the same car parts every day and set the same five options each time.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help?
      placeholder: Let me save export settings as a preset.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How do you handle it now?
      description: A workaround, another add-on, or nothing.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - .dae import
        - .dae export
        - .cdae import
        - .cdae export
        - BeamNG vehicles and configs
        - UI and settings
        - Something else
    validations:
      required: true
